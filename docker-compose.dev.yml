name: meadow-dev

# Local development infrastructure for Meadow PIM.
# Start with:  docker compose -f docker-compose.dev.yml up -d

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    # The image runs as `nonroot`; on Docker Desktop Windows the named
    # volume is root-owned, so RocksDB cannot create its directory. Run as
    # root for local development only (production hardening is a later phase).
    user: root
    command:
      - start
      - --user
      - root
      - --pass
      - root
      - rocksdb:/data/meadow.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    healthcheck:
      # The SurrealDB CLI binary lives at /surreal and the readiness subcommand is
      # `is-ready`. In this image `surreal` (without path) and the old `isready`/
      # `--conn` spellings are not available, so use the full path and default endpoint.
      test: ["CMD", "/surreal", "is-ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meadow
      MINIO_ROOT_PASSWORD: meadow-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis: # optional cache
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog: # dev SMTP catcher for export e-mails (UI/API on :8025)
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + HTTP API

volumes:
  surrealdb_data:
  nats_data:
  minio_data:
