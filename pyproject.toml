[project]
name = "meadow-pim"
version = "0.1.0"
description = "Meadow PIM — Python services (worker and frontend) and shared business rules"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.0",
    "pydantic>=2.10",
    "nats-py>=2.9",
    "httpx>=0.28",
    "structlog>=24.4",
    "babel>=2.16",
    "restrictedpython>=8.5",
    "openpyxl>=3.1.5",
    "aiosmtplib>=5.1.3",
    "boto3>=1.43.91",
    "lxml>=6.1.3",
    "markdown>=3.10.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "playwright>=1.62.0",
    "sloppylint>=0.5.1",
    "ai-slop-detector[go,js]>=3.8.9",
    "slopguards>=0.5.0",
    "aislop>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# `tests/fixtures/deslop/` holds intentionally sloppy samples that prove the
# Deslop rules actually fire (plan/detail/ai-code-quality.md). The directory is
# excluded from the repository's own scan in stopslop.toml and from ruff here,
# so neither the formatter nor the linters rewrite it.
extend-exclude = ["tests/fixtures/deslop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The type check is a gate and grows module by module: the scope lives here, so
# `scripts/check.*`, the local run (`uv run mypy`) and the documentation cannot
# drift apart. A module is added once it is clean; `meadow/frontend` follows
# (plan/detail/ai-code-quality.md §4.6).
files = [
    "meadow/worker",
    "meadow/rules",
    "meadow/tabular.py",
    "meadow/urls.py",
    "meadow/mef.py",
    "scripts",
    # Frontend modules, added one by one as they became clean (2026-09-18). The
    # remaining ones are the widget-heavy pages; they follow the same way.
    "meadow/frontend/__main__.py",
    "meadow/frontend/api.py",
    "meadow/frontend/attribute_definitions.py",
    "meadow/frontend/attribute_form.py",
    "meadow/frontend/auth.py",
    "meadow/frontend/categories.py",
    "meadow/frontend/channels.py",
    "meadow/frontend/config.py",
    "meadow/frontend/config_page.py",
    "meadow/frontend/connectors.py",
    "meadow/frontend/connector_form.py",
    "meadow/frontend/display.py",
    "meadow/frontend/edit_queue.py",
    "meadow/frontend/enum_sets.py",
    "meadow/frontend/enums.py",
    "meadow/frontend/export_fields.py",
    "meadow/frontend/export_page.py",
    "meadow/frontend/export_profiles.py",
    "meadow/frontend/filters.py",
    "meadow/frontend/form.py",
    "meadow/frontend/groups.py",
    "meadow/frontend/grid.py",
    "meadow/frontend/help_content.py",
    "meadow/frontend/help_page.py",
    "meadow/frontend/i18n.py",
    "meadow/frontend/import_page.py",
    "meadow/frontend/jobs.py",
    "meadow/frontend/languages.py",
    "meadow/frontend/layout.py",
    "meadow/frontend/lazy_tree.py",
    "meadow/frontend/logs.py",
    "meadow/frontend/multilang.py",
    "meadow/frontend/object_picker.py",
    "meadow/frontend/object_types.py",
    "meadow/frontend/password.py",
    "meadow/frontend/range_values.py",
    "meadow/frontend/reference_data.py",
    "meadow/frontend/relation_definitions.py",
    "meadow/frontend/relation_roles.py",
    "meadow/frontend/rules.py",
    "meadow/frontend/saved_searches.py",
    "meadow/frontend/search_form.py",
    "meadow/frontend/settings.py",
    "meadow/frontend/taxonomy_tree.py",
    "meadow/frontend/theme.py",
    "meadow/frontend/units.py",
    "meadow/frontend/url_values.py",
    "meadow/frontend/users.py",
    "meadow/frontend/views.py",
]
python_version = "3.14"
show_error_codes = true
# mypy analyses imported modules too; without this, adding one clean file would
# report the errors of every unclean module it imports, and the scope could never
# grow. Only the files listed above are reported - a module that is not listed
# yet stays unchecked instead of blocking the gate.
follow_imports = "silent"
# An `# type: ignore` that no longer suppresses anything is a lie in the code -
# this is the check that keeps the escapes honest.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Libraries without a `py.typed` marker or stubs: their internals are out of our
# hands, so only our own use of them is checked.
module = ["openpyxl.*", "lxml.*", "boto3.*", "botocore.*", "markdown.*", "engineio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
