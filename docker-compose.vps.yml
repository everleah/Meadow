# Meadow PIM — production deployment (VPS behind Traefik).
#
# Mirrors plan/detail/betrieb-deployment.md §3. External Traefik routes only the
# frontend and the API; SurrealDB, NATS, MinIO, Redis and the worker stay on the
# internal `meadow-backend` network. Images are pulled from ${PIM_REGISTRY}.
#
# Usage:
#   cp .env.vps.example .env.vps   # fill in secrets
#   ./scripts/deploy-vps-meadow.sh

name: meadow

# Container logs are the ops trail (plan/detail/betrieb-deployment.md §11.1):
# 10 MB per file, 5 files, then the oldest is dropped. Without this the disk of a
# small VPS fills up over months.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    # RocksDB cannot create its directory in a root-owned named volume under the
    # image's default nonroot user, so run as root (the dev compose does the same;
    # production hardening is a later phase).
    user: root
    command:
      - start
      - --user
      - "${SURREALDB_USER}"
      - --pass
      - "${SURREALDB_PASS}"
      - rocksdb:/data/meadow.db
    volumes:
      - surrealdb_data:/data
    networks:
      - meadow-backend
    # Loopback only, never through Traefik: the migration runner and the admin
    # CLIs talk to `POST /sql` over it (scripts/run-migration.sh).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:8222:8222"   # monitoring on loopback only
    volumes:
      - nats_data:/data
    networks:
      - meadow-backend
    restart: unless-stopped
    logging: *default-logging
    # No healthcheck: this image has no shell and no curl/wget, so there is
    # nothing to run inside it. The monitoring port is checked from the host by
    # scripts/healthcheck-vps.sh (`/healthz`).

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY}"
    volumes:
      - object_storage_data:/data
    networks:
      - meadow-backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis: # optional cache; keep disabled unless multi-instance is needed
    image: redis:7-alpine
    profiles: ["optional"]
    networks:
      - meadow-backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  pim-core:
    image: "${PIM_REGISTRY}/pim-core:${PIM_CORE_TAG}"
    environment:
      PIM_CORE_ADDR: "0.0.0.0:8080"
      SURREALDB_URL: "${SURREALDB_URL}"
      SURREALDB_NAMESPACE: "${SURREALDB_NAMESPACE}"
      SURREALDB_DATABASE: "${SURREALDB_DATABASE}"
      SURREALDB_USER: "${SURREALDB_USER}"
      SURREALDB_PASS: "${SURREALDB_PASS}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-3600}"
      LOG_INGEST_API_KEY: "${LOG_INGEST_API_KEY}"
      RULES_NATS_URL: "${RULES_NATS_URL}"
      RULES_SUBJECT: "${RULES_SUBJECT}"
      RULES_COMPILE_SUBJECT: "${RULES_COMPILE_SUBJECT}"
      RULES_TIMEOUT_MS: "${RULES_TIMEOUT_MS:-2000}"
      RULES_DEGRADE: "${RULES_DEGRADE:-false}"
      RULES_BREAKER_THRESHOLD: "${RULES_BREAKER_THRESHOLD:-3}"
      JOBS_NATS_URL: "${JOBS_NATS_URL}"
      JOBS_STREAM_MAX_AGE_MINUTES: "${JOBS_STREAM_MAX_AGE_MINUTES:-1440}"
      EVENTS_NATS_URL: "${EVENTS_NATS_URL}"
      EVENTS_STREAM_MAX_AGE_DAYS: "${EVENTS_STREAM_MAX_AGE_DAYS:-30}"
      EVENTS_STREAM_MAX_BYTES: "${EVENTS_STREAM_MAX_BYTES:-1073741824}"
      EVENT_RELAY_INTERVAL_S: "${EVENT_RELAY_INTERVAL_S:-5}"
      PIM_MAX_BODY_BYTES: "${PIM_MAX_BODY_BYTES:-10485760}"
      PIM_RATE_LIMIT_PER_MINUTE: "${PIM_RATE_LIMIT_PER_MINUTE:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_PERSIST_LEVEL: "${LOG_PERSIST_LEVEL:-WARN}"
      LOG_PERSIST_CATEGORIES: "${LOG_PERSIST_CATEGORIES:-app,rule}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      LOG_RATE_LIMIT: "${LOG_RATE_LIMIT:-1000}"
      LOG_CLEANUP_INTERVAL_S: "${LOG_CLEANUP_INTERVAL_S:-3600}"
      SCHEDULER_INTERVAL_S: "${SCHEDULER_INTERVAL_S:-60}"
    depends_on:
      surrealdb:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"   # bind on loopback; exposed publicly via Traefik on traefik-net
    networks:
      - meadow-backend
      - traefik-net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      - "traefik.http.routers.meadow-api.rule=Host(`${PIM_API_HOST}`)"
      - "traefik.http.routers.meadow-api.entrypoints=websecure"
      - "traefik.http.routers.meadow-api.tls=true"
      - "traefik.http.routers.meadow-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.meadow-api-redirect.rule=Host(`${PIM_API_HOST}`)"
      - "traefik.http.routers.meadow-api-redirect.entrypoints=web"
      - "traefik.http.routers.meadow-api-redirect.middlewares=meadow-https-redirect"
      - "traefik.http.middlewares.meadow-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.meadow-api.loadbalancer.server.port=8080"

  pim-frontend:
    image: "${PIM_REGISTRY}/pim-frontend:${PIM_FRONTEND_TAG}"
    environment:
      PIM_CORE_URL: "${PIM_CORE_URL}"
      PIM_FRONTEND_HOST: "0.0.0.0"
      PIM_FRONTEND_PORT: "8081"
      UI_STORAGE_SECRET: "${UI_STORAGE_SECRET}"
      # The frontend streams export downloads, so it needs the same bucket as
      # the worker (meadow/frontend/exports.py imports meadow.worker.storage).
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      # Licensed BMEcat schema: not in the image, needs a bind mount (plan §14).
      BMECAT_XSD: "${BMECAT_XSD:-}"
    volumes:
      - meadow_nicegui:/app/.nicegui
      - meadow_storage:/tmp/meadow
    depends_on:
      pim-core:
        condition: service_healthy
    networks:
      - meadow-backend
      - traefik-net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8081/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      - "traefik.http.routers.meadow-ui.rule=Host(`${PIM_UI_HOST}`)"
      - "traefik.http.routers.meadow-ui.entrypoints=websecure"
      - "traefik.http.routers.meadow-ui.tls=true"
      - "traefik.http.routers.meadow-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.meadow-ui-redirect.rule=Host(`${PIM_UI_HOST}`)"
      - "traefik.http.routers.meadow-ui-redirect.entrypoints=web"
      - "traefik.http.routers.meadow-ui-redirect.middlewares=meadow-https-redirect"
      - "traefik.http.services.meadow-ui.loadbalancer.server.port=8081"

  pim-worker:
    image: "${PIM_REGISTRY}/pim-worker:${PIM_WORKER_TAG}"
    environment:
      NATS_URL: "${NATS_URL}"
      RULES_EVALUATE_SUBJECT: "${RULES_SUBJECT}"
      RULES_COMPILE_SUBJECT: "${RULES_COMPILE_SUBJECT}"
      PIM_CORE_URL: "${PIM_CORE_URL}"
      LOG_INGEST_API_KEY: "${LOG_INGEST_API_KEY}"
      LOG_FLUSH_INTERVAL_S: "${LOG_FLUSH_INTERVAL_S:-5}"
      LOG_CONFIG_REFRESH_INTERVAL_S: "${LOG_CONFIG_REFRESH_INTERVAL_S:-60}"
      JOBS_STREAM: "${JOBS_STREAM:-JOBS}"
      JOBS_SUBJECT: "${JOBS_SUBJECT:-jobs.*}"
      JOBS_CONSUMER_DURABLE: "${JOBS_CONSUMER_DURABLE:-job-worker}"
      JOBS_ACK_WAIT_S: "${JOBS_ACK_WAIT_S:-300}"
      JOBS_MAX_DELIVER: "${JOBS_MAX_DELIVER:-5}"
      JOBS_CONCURRENCY: "${JOBS_CONCURRENCY:-4}"
      # Exports are archived into the bucket; without these the worker keeps
      # them inline and the frontend has nothing to stream.
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      EXPORT_INLINE_MAX_BYTES: "${EXPORT_INLINE_MAX_BYTES:-1000000}"
      # Licensed BMEcat schema: not in the image, needs a bind mount (plan §14).
      BMECAT_XSD: "${BMECAT_XSD:-}"
    volumes:
      - meadow_storage:/tmp/meadow
    depends_on:
      nats:
        condition: service_started
      surrealdb:
        condition: service_healthy
    networks:
      - meadow-backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # The worker has no HTTP endpoint; the check proves the process is alive and
      # that NATS is reachable from it.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('nats', 4222), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  meadow-backend:
    driver: bridge
  traefik-net:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik-net}"

volumes:
  surrealdb_data:
  nats_data:
  object_storage_data:
  meadow_storage:
  meadow_nicegui:
